# Configuração do CLI de desenvolvimento do Alembic — só para GERAR revisão nova
# (`make db-revision`). O runtime não lê este arquivo: a imagem instala os pacotes com
# `--no-editable` e `croquito_api.bootstrap` monta a configuração em Python, resolvendo o
# caminho das migrations pelo pacote instalado (ADR-0029).
#
# `sqlalchemy.url` está deliberadamente AUSENTE: a URL vem de `CROQUITO_DATABASE_URL`,
# resolvida por `ApiSettings.from_environment()` dentro de `migrations/env.py`. Fixar a
# URL aqui criaria uma segunda verdade sobre qual banco a ferramenta toca.

[alembic]
script_location = services/api/src/croquito_api/migrations
# Nome ordenável: a revisão é numérica e sequencial, então o diretório lista na ordem em
# que as migrations se aplicam.
file_template = %%(rev)s_%%(slug)s
