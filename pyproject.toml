[project]
name = "croquito"
version = "0.1.0"
description = "Pipeline auditavel para transformar croquis em cenas tecnicas e DXF."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Runner de migrations revisadas (ADR-0029): as revisões vivem dentro de
  # `croquito_api.migrations` e são aplicadas por `croquito_api.bootstrap`. Dependência de
  # runtime, não de desenvolvimento — a imagem instala com `uv sync --no-dev` e o job de
  # banco da esteira roda dentro dela. MIT, mantida pelos autores do SQLAlchemy.
  "alembic>=1.14,<2",
  "boto3>=1.40,<2",
  "ezdxf>=1.4,<2",
  "fastapi>=0.116,<1",
  # Token ADC do braço de OCR (`croquito_worker.providers.GcpVisionOcrAdapter`): já era
  # dependência transitiva de `google-cloud-pubsub`; passa a ser declarada porque agora há
  # import direto (`google.auth.default()`). Apache-2.0, mantida pelo Google.
  "google-auth>=2.56,<3",
  # Transporte da fila quando o deploy é GCP (`croquito_api.pubsub_queue`): publica os
  # mesmos comandos que o adaptador SQS. Apache-2.0, mantida pelo Google; fica atrás de
  # `CROQUITO_PUBSUB_TOPIC` e o SDK só é importado quando esse backend é escolhido.
  "google-cloud-pubsub>=2.31,<3",
  "matplotlib>=3.10,<4",
  # Álgebra do braço semântico do matcher SCO (`valuation/sco_matching.py`): kNN por
  # cosseno em força bruta e decodificação dos vetores float32 do índice. Já era
  # dependência transitiva do OpenCV e do matplotlib; passa a ser declarada porque agora
  # há import direto. BSD-3, mantida pelo NumFOCUS.
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.12,<5",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  # Upload multipart do servidor local de homologação (`POST /plates`): FastAPI/Starlette
  # não parseiam `multipart/form-data` sem ele. Apache-2.0, mantido pelo ecossistema
  # Starlette; nenhum tipo de domínio depende dele.
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
croquito-demo = "croquito_worker.cli:main"
croquito-valuation = "croquito_worker.valuation.cli:main"
croquito-worker-push = "croquito_worker.push_server:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "packages/core/src",
  "packages/valuation/src",
  "services/api/src",
  "services/worker/src",
]

[tool.setuptools.package-data]
# Seed versionado de sinônimos de domínio (`catalog.default_domain_synonyms`), carregado
# via `importlib.resources`; sem esta entrada o wheel não empacota o JSON.
croquito_valuation = ["data/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Espelho pinado da camada global da Engineering OS (ADR-0034): é cópia fiel da origem e
# não é reformatado por nós. O `check_docs.py` continua validando os links dele.
extend-exclude = ["docs/engineering-os"]
src = [
  "packages/core/src",
  "packages/valuation/src",
  "services/api/src",
  "services/worker/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.coverage.run]
branch = true
source = ["croquito_core", "croquito_valuation", "croquito_api", "croquito_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# `google.api_core` publica py.typed mas deixa os construtores das exceções sem anotação;
# levantá-las no teste do adaptador Pub/Sub é uso legítimo.
untyped_calls_exclude = ["cv2", "pymupdf", "google.api_core"]

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "cv2.*",
  "fitz",
  # `google.api_core` é tipado; os módulos gerados do Pub/Sub não têm py.typed.
  "google.cloud.*",
  "matplotlib.*",
  "openpyxl.*",
  "PIL.*",
  "shapely.*",
]
ignore_missing_imports = true
