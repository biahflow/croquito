name: croquito-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: croquito
      POSTGRES_USER: croquito
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croquito -d croquito"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.10.0
    environment:
      AWS_DEFAULT_REGION: sa-east-1
      DEBUG: "0"
      PERSISTENCE: "0"
      SERVICES: s3,sqs,stepfunctions,eventbridge,secretsmanager
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack/init:/etc/localstack/init/ready.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      # Só o realm LOCAL é montado, arquivo a arquivo. Montar a pasta inteira passou a
      # importar também o realm de homologação (`croquito-hml-realm.json`), que tem o
      # mesmo nome de realm `croquito` e nenhum usuário: como o Keycloak percorre o
      # diretório em ordem alfabética e ignora o segundo realm de mesmo nome, o ambiente
      # local subiria sem o usuário de desenvolvimento.
      - ./keycloak/croquito-realm.json:/opt/keycloak/data/import/croquito-realm.json:ro
      # O tema `croquito` é artefato de imagem em homologação (ADR-0032, D8), mas aqui a
      # imagem é a estoque: sem esta montagem o realm local apontaria `loginTheme` para um
      # tema que não existe no container, e o Keycloak cairia no tema padrão sem avisar.
      # Tema em diretório NÃO exige `kc.sh build` — só JAR em `providers/` exige (guia do
      # desenvolvedor da 26.2, capítulo Themes) —, e `start-dev` não cacheia tema, então
      # editar o arquivo e recarregar a página basta.
      - ./keycloak/themes/croquito:/opt/keycloak/themes/croquito:ro

volumes:
  postgres-data:
