# Borda pública da homologação (serviço `croquito-web-hml`, ADR-0025).
#
# É o único serviço com ingress público: ele serve a SPA em subrota e leva o resto
# aos serviços internos pela MESMA origem. Same-origin não é estética — é o que faz o
# cookie de sessão do Keycloak, o `redirect_uri` do login e o `Authorization` das chamadas
# viverem sob um endereço só, sem CORS entre as peças do próprio produto.
#
#   /            -> 302 /login
#   /login       -> SPA (index servido em /revisao/)
#   /revisao/    -> SPA com as duas jornadas: croqui e medição (apps/web)
#   /medicao/    -> 302 /revisao/?rodada= (endereço herdado da SPA que virou jornada)
#   /api/        -> croquito-scene-hml        (prefixo REMOVIDO: /api/healthz -> /healthz)
#   /auth/       -> croquito-auth-hml       (prefixo PRESERVADO: o Keycloak vive em /auth)
#
# Decisões que este arquivo carrega:
#
# - **Upstream pelos VIPs do `private.googleapis.com`, não por DNS.** Medido em
#   2026-08-14: com Direct VPC egress, a resolução de `*.run.app` do ambiente
#   serverless devolvia os IPs públicos do Google Frontend mesmo com a zona privada
#   `run.app` na VPC — e o ingress interno recusava o tráfego como externo. Conectar
#   direto em 199.36.153.8/30 (faixa fixa e documentada do private.googleapis.com)
#   força o caminho que o Cloud Run classifica como interno, sem depender de DNS.
#   O serviço de destino vai no SNI (`proxy_ssl_name`) e no `Host` — os endereços
#   continuam determinísticos (`croquito-<serviço>-hml-<número do projeto>.<região>.
#   run.app`); TROCAR DE URL EXIGE RECONSTRUIR ESTA IMAGEM.
# - **`Host` é o host interno, nunca o público.** O Cloud Run roteia pelo `Host`; mandar
#   `croquito-hml.biahflow.ai` para lá faria a requisição não encontrar serviço nenhum.
#   Quem carrega o endereço que o navegador usou é `X-Forwarded-Host`/`-Proto`, e é deles
#   que o Keycloak monta o issuer (`KC_PROXY_HEADERS=xforwarded`).
# - **Upload não passa por aqui.** Documento de cena e prancha de medição vão presignados
#   direto ao bucket; nenhum corpo grande atravessa esta borda, e o teto fica em 1m.

# Os quatro VIPs da faixa do private.googleapis.com; o Cloud Run atende neles com o
# certificado do host pedido no SNI. TLS sem verificação de cadeia aqui (default do
# nginx): o tráfego nunca sai do backbone da Google e o destino é IP fixo da própria
# Google — risco aceito em homologação e registrado.
upstream google_private_vip {
    server 199.36.153.8:443;
    server 199.36.153.9:443;
    server 199.36.153.10:443;
    server 199.36.153.11:443;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # `Location` relativo. O Cloud Run termina o TLS e entrega em HTTP na porta 8080, então
    # o endereço absoluto que o nginx montaria sozinho sairia como `http://…:8080/…` — com
    # o esquema e a porta errados para quem está do lado de fora.
    absolute_redirect off;

    # Corpo pequeno: documento e prancha vão presignados direto ao bucket, então nenhum
    # arquivo de usuário atravessa este proxy.
    client_max_body_size 1m;

    # Sem token de sessão em log de acesso, e nada de corpo: a política de log do
    # repositório vale para a borda como vale para a aplicação.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Raiz do host é a porta de entrada do produto.
    location = / {
        return 302 /login;
    }

    # `/login` é servido pelo mesmo build da SPA; os assets continuam sob `/revisao/`.
    location = /login {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /revisao/index.html =404;
    }

    # Endereço digitado sem a barra final ainda é o app.
    location = /revisao {
        return 302 /revisao/;
    }

    # `/medicao/` foi SPA própria até a medição virar jornada de `apps/web` (ADR-0028, D9).
    # O endereço continua salvo em favorito de quem homologou, então ele leva à jornada
    # nova em vez de virar 404. `?rodada=` é a forma canônica de "medição, nenhuma rodada
    # aberta" (`apps/web/src/route.ts`); a barra final é opcional para quem digita.
    location ~ ^/medicao/?$ {
        return 302 /revisao/?rodada=;
    }

    # ---------------------------------------------------------------------
    # Proxies para os serviços internos
    # ---------------------------------------------------------------------

    location ^~ /api/ {
        # A barra final REMOVE o prefixo: /api/healthz chega como /healthz.
        #
        # ATENÇÃO ao verificar a API por aqui: **o Cloud Run reserva `/healthz`
        # na raiz de todo serviço**. Como esta location remove o prefixo,
        # `/api/healthz` chega ao Cloud Run exatamente como o path reservado e a
        # requisição nunca alcança o container — o 404 vem do Google, não do
        # FastAPI. Provado em 2026-08-18 pela diferença entre os corpos:
        # `/api/healthzz` devolve o problem+json da aplicação; `/api/healthz`
        # devolve a página de erro do Google; e no próprio nginx, um path
        # inexistente devolve o 404 do nginx enquanto `/healthz` devolve o do
        # Google. `/healthz` continua servindo ao startup probe, que chama o
        # container direto, sem passar pela borda. Para verificação externa use
        # `/api/v1/meta` — é o que `scripts/smoke_hml.py` faz.
        #
        # Era ESTE o "bug de roteamento no GFE" que em 2026-08-14 motivou
        # renomear croquito-api-hml para croquito-scene-hml. Não era bug, e o
        # rename não tinha como resolver.
        proxy_pass https://google_private_vip/;
        proxy_ssl_server_name on;
        proxy_ssl_name croquito-scene-hml-209400815796.us-east1.run.app;
        proxy_http_version 1.1;
        proxy_set_header Host croquito-scene-hml-209400815796.us-east1.run.app;
        proxy_set_header X-Forwarded-Host croquito-hml.biahflow.ai;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /auth/ {
        # Aqui o prefixo é PRESERVADO: o Keycloak sobe com KC_HTTP_RELATIVE_PATH=/auth e
        # emite URLs (issuer, authorization_endpoint, JWKS) já com ele. Remover o /auth
        # aqui quebraria a descoberta do OIDC em silêncio.
        proxy_pass https://google_private_vip/auth/;
        proxy_ssl_server_name on;
        proxy_ssl_name croquito-auth-hml-209400815796.us-east1.run.app;
        proxy_http_version 1.1;
        proxy_set_header Host croquito-auth-hml-209400815796.us-east1.run.app;
        proxy_set_header X-Forwarded-Host croquito-hml.biahflow.ai;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # O Keycloak roda com min_instances=1, mas um deploy/reinício ainda o tira do ar
        # por dezenas de segundos; a leitura espera mais que as demais para que um login
        # nesse intervalo não morra em 504.
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # Estáticos da SPA
    # ---------------------------------------------------------------------

    # Nome com hash: o conteúdo nunca muda sob o mesmo nome, então cache longo é seguro.
    location ~* ^/revisao/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # O index é o mapa dos assets da versão no ar; cacheá-lo serviria a versão anterior
    # apontando para arquivos que já saíram. Esta location também recebe o fallback da
    # SPA abaixo (o `try_files` faz redirecionamento interno e o casamento roda de novo).
    location ~* ^/revisao/index\.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /revisao/ {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /revisao/index.html;
    }

    # A SPA tem o seu favicon em `/revisao/favicon.svg`; este é o pedido que o navegador
    # faz sozinho na raiz do host.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /revisao/favicon.svg =404;
    }

    # Nada mais é servido: o diretório raiz da imagem do nginx traz uma página de boas
    # vindas, e ela não faz parte deste produto.
    location / {
        return 404;
    }
}
