# Tema `croquito` — tipo `email`.
#
# `parent=keycloak` e não `keycloak.v2`: o tema v2 embutido na 26.2 tem SÓ o tipo `login`
# (`ls theme/keycloak.v2` na `org.keycloak.keycloak-themes-26.2.5.jar` devolve `login` e
# mais nada). Parent é resolvido por TIPO, então cada tipo escolhe o seu — e para e-mail o
# `keycloak` embutido é quem existe. Ele próprio só faz `parent=base`.
parent=keycloak

# Um único arquivo sobrescrito: `html/template.ftl`, o layout por onde passam TODOS os
# e-mails HTML do Keycloak (`password-reset`, `executeActions`, `email-verification`,
# `org-invite`, os `event-*`). Vestir o layout veste a família inteira sem tocar em nenhum
# e-mail específico — e sem tocar no TEXTO, que é da F-008 e tem gate próprio.
#
# A versão `text/` continua a do pai, de propósito: e-mail em texto puro não se veste.
