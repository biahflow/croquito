# Tema `croquito` — tipo `login`.
#
# `parent=keycloak.v2` porque essa é a versão VIVA do tema embutido na 26.2: as notas de
# versão do Keycloak dizem que a v2 virou o padrão de todo realm novo e que a v1 (`keycloak`)
# está deprecada e "será removida numa versão futura". Herdar o tema deprecado seria comprar
# a quebra do próximo major de graça.
#
# Nenhum `.ftl` de login é sobrescrito, de propósito. Todo o vestuário é CSS sobre o DOM que
# o `template.ftl` da v2 já monta — inclusive as páginas que a F-008 vai alcançar, que usam
# o mesmo shell. Quanto menos template custom, menor a superfície que um upgrade quebra;
# e os seletores que o smoke headless procura (`#kc-form-login`, `input[name='username']`)
# continuam sendo os do Keycloak, porque o markup continua sendo o do Keycloak.
parent=keycloak.v2

# A folha da v2 vem primeiro e a nossa depois: `croquito.css` repinta, não substitui.
# `css/styles.css` resolve no tema pai — a busca de recurso percorre a cadeia de parents.
styles=css/styles.css css/croquito.css

# A v2 troca sozinha para um tema escuro quando o sistema pede (`prefers-color-scheme`).
# Desligado aqui: a marca é "grafite técnico" — superfície clara, tinta grafite — e não
# existe paleta escura aprovada para esta tela. Meia-marca é pior que marca nenhuma.
darkMode=false
