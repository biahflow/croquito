# CI de pull request. O portão em si mora em `quality.yml`, chamado aqui e também pelo
# deploy — um arquivo só, para os dois não divergirem com o tempo.
#
# **Sem gatilho de `push` na `main`, de propósito.** Merge é um push, e com o gatilho aqui
# o merge acordava este workflow e o `deploy-hml` no mesmo segundo, para o mesmo commit,
# correndo em paralelo: dois runs no histórico e, o que importa, um deploy que não esperava
# o portão. Na `main` quem roda o portão é o próprio deploy, antes de publicar.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # PORTÃO DE QUALITY TEMPORARIAMENTE DESLIGADO (decisão humana, 2026-08-25) para
  # destravar o push de demandas urgentes. A `main` não é protegida, então este check é
  # informativo e não bloqueia merge; o `if: false` apenas evita rodar o portão em PR.
  # Controle compensatório: `make check` + `make test` locais antes de cada push.
  # Para religar, remova a linha `if: false` abaixo.
  quality:
    if: false
    uses: ./.github/workflows/quality.yml
