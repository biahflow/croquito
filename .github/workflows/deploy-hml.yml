# Deploy de homologação (GCP, projeto `biahflow-hml`, região `us-east1`).
#
# **Este workflow é dono da imagem e do container; não é dono da infraestrutura.** A
# casca dos serviços (ingress, IAM, min/max instâncias, mapeamento de domínio, tópico,
# buckets e segredos) é criada fora daqui; o que o deploy troca é a imagem e o que
# depende dela — comando, variáveis, segredos montados e volumes. Misturar as duas
# coisas faria um deploy de rotina poder derrubar rede.
#
# Autentica por Workload Identity Federation: **nenhuma chave de conta de serviço
# existe**, e a organização proíbe criá-las. Este workflow é o único caminho de
# publicação — imagem construída em máquina de desenvolvimento não sobe.
#
# Decisões que valem para tudo abaixo:
#
# - **Tag pelo `$GITHUB_SHA`, nunca `latest`.** É o que permite voltar apontando a
#   revisão anterior e o que faz duas revisões serem distinguíveis.
# - **Uma imagem Python para quatro processos** (API, worker, medição e o job de
#   banco): eles rodam o mesmo código e só divergem em `command`/`args`.
# - **O job de banco roda antes da API.** Código novo contra schema velho é a forma
#   mais barata de transformar deploy em incidente.
name: deploy-hml

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - "apps/**"
      - "docker/**"
      - "keycloak/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-hml.yml"
  workflow_dispatch:

concurrency:
  # Dois deploys ao mesmo tempo põem revisões fora de ordem: a segunda a terminar vence,
  # e não é necessariamente a mais nova. `cancel-in-progress: false` porque cancelar no
  # meio pode deixar o schema migrado e a revisão antiga servindo.
  group: deploy-hml
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # o token OIDC que o WIF troca por credencial

env:
  PROJETO: biahflow-hml
  REGIAO: us-east1
  REGISTRO: us-east1-docker.pkg.dev/biahflow-hml/hml

jobs:
  # PORTÃO DE QUALITY TEMPORARIAMENTE DESLIGADO (decisão humana, 2026-08-19, rodada de
  # verificação V8+). Durante esta fase os testes de HML iteram por push direto na
  # `main`, sem PR, e o deploy não espera o `quality.yml` — o controle compensatório é
  # `make check` + `make test` rodados localmente antes de cada push. O `ci.yml`
  # continua rodando o portão em qualquer PR. Para religar, restaure aqui o job
  # `quality:` (uses: ./.github/workflows/quality.yml) e o `needs: quality` do deploy;
  # sem ele, `workflow_dispatch` e push direto na `main` sobem imagem sem conferência.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: biahflow-hml
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: hml-deploy@biahflow-hml.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autoriza o registro
        run: gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet

      # `--platform linux/amd64` é explícito e não custa nada no runner (que já é amd64):
      # ele existe para o dia em que alguém repetir o comando numa máquina ARM e o
      # Cloud Run recusar a imagem — recusa que aparece só no deploy, não no build.
      - name: Constrói e publica a imagem Python
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$REGISTRO/croquito-python:$GITHUB_SHA" -f docker/python.Dockerfile .
          docker push "$REGISTRO/croquito-python:$GITHUB_SHA"

      # Contexto `keycloak/`: a imagem do Keycloak precisa do realm e de mais nada. Dar
      # a raiz do repositório como contexto mandaria o código inteiro para o daemon.
      - name: Constrói e publica a imagem do Keycloak
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$REGISTRO/croquito-auth:$GITHUB_SHA" -f keycloak/Dockerfile keycloak
          docker push "$REGISTRO/croquito-auth:$GITHUB_SHA"

      # O nginx do host público chega na Entrega 3. Enquanto `docker/web.Dockerfile` não
      # existir, os dois passos do web são pulados em vez de quebrarem o workflow: o
      # resto do ambiente já sobe e é operável pelas URLs internas do Cloud Run.
      - name: Constrói e publica a imagem do nginx
        if: hashFiles('docker/web.Dockerfile') != ''
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$REGISTRO/croquito-web:$GITHUB_SHA" -f docker/web.Dockerfile .
          docker push "$REGISTRO/croquito-web:$GITHUB_SHA"

      # `--args=` com sinal de igual, aqui e nos deploys abaixo: o valor começa com `-m`,
      # e na forma separada por espaço o parser do gcloud leria o próprio valor como se
      # fosse outra flag.
      #
      # `bootstrap.py` é o runner de migrations revisadas (ADR-0029): aplica as revisões
      # que faltam, adota por carimbo o banco anterior ao runner — recusando carimbar um
      # banco defasado — e é forward-only, sem caminho de `downgrade`. Reverter é apontar
      # a revisão anterior da imagem (ADR-0025).
      # Falhar aqui **para o deploy**, antes de qualquer revisão nova entrar no ar.
      - name: Inicializa o schema
        run: |
          set -euo pipefail
          gcloud run jobs deploy croquito-db-init-hml \
            --image "$REGISTRO/croquito-python:$GITHUB_SHA" \
            --region "$REGIAO" \
            --service-account croquito-api-hml@biahflow-hml.iam.gserviceaccount.com \
            --set-secrets CROQUITO_DATABASE_URL=croquito-hml-database-url:latest \
            --command python \
            --args=-m,croquito_api.bootstrap \
            --max-retries 1 \
            --quiet
          gcloud run jobs execute croquito-db-init-hml --region "$REGIAO" --wait --quiet

      # Storage: GCS pela interoperabilidade S3 (`CROQUITO_STORAGE_FLAVOR=gcs` desliga
      # checksum SHA-256 no PUT e SSE-S3, que a API XML do GCS não aceita). Fila: o
      # tópico configurado é o que escolhe o transporte Pub/Sub.
      - name: Publica a API
        run: |
          set -euo pipefail
          gcloud run services update croquito-scene-hml \
            --image "$REGISTRO/croquito-python:$GITHUB_SHA" \
            --region "$REGIAO" \
            --service-account croquito-api-hml@biahflow-hml.iam.gserviceaccount.com \
            --port 8080 \
            --command uvicorn \
            --args=croquito_api.main:app,--host,0.0.0.0,--port,8080 \
            --memory 1Gi --cpu 1 --timeout 60 --no-cpu-throttling \
            --set-secrets CROQUITO_DATABASE_URL=croquito-hml-database-url:latest,AWS_ACCESS_KEY_ID=croquito-hml-storage-hmac-id:latest,AWS_SECRET_ACCESS_KEY=croquito-hml-storage-hmac-secret:latest \
            --set-env-vars CROQUITO_STORAGE_FLAVOR=gcs,CROQUITO_AWS_ENDPOINT_URL=https://storage.googleapis.com,AWS_REGION=us-east1,CROQUITO_ARTIFACT_BUCKET=croquito-hml-artifacts,CROQUITO_PUBSUB_TOPIC=projects/biahflow-hml/topics/croquito-hml-processing,CROQUITO_OIDC_ISSUER=https://croquito-hml.biahflow.ai/auth/realms/croquito,CROQUITO_OIDC_AUDIENCE=croquito-web,CROQUITO_OIDC_JWKS_URL=https://croquito-web-hml-209400815796.us-east1.run.app/auth/realms/croquito/protocol/openid-connect/certs,CROQUITO_WEB_ORIGIN=https://croquito-hml.biahflow.ai,CROQUITO_REAL_PROVIDERS_ENABLED=true \
            --startup-probe httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=3,periodSeconds=5,failureThreshold=12,timeoutSeconds=3 \
            --quiet

      # O worker recebe comando por push do Pub/Sub em `POST /pubsub` e nunca é chamado
      # de fora: a assinatura da entrega é verificada pela IAM do Cloud Run antes de o
      # processo ver a requisição. `--timeout 900` porque render de PDF, visão e export
      # DXF são minutos, não segundos; `--concurrency 4` porque cada comando é pesado em
      # CPU e memória. Ele não tem `CROQUITO_STORAGE_FLAVOR` — o flavor da API é da
      # camada de presign; do lado do worker o que muda é `CROQUITO_STORAGE_SSE=false`,
      # porque o GCS recusa SSE-S3.
      #
      # `CROQUITO_REAL_PROVIDERS_ENABLED=false` é o kill switch: desligar aqui basta
      # para nenhuma chamada paga sair, sem redeploy de código. `CROQUITO_AI_MAX_ESTIMATED_COST_USD`
      # é teto POR INVOCAÇÃO do worker, não por dia nem por job — uma reentrega do
      # Pub/Sub (até 5 tentativas, ver DLQ acima) multiplica o gasto potencial pelo
      # número de tentativas.
      #
      # `CROQUITO_PROVIDER_TIMEOUT_SECONDS=240` porque sem ela o braço OpenAI usava o
      # default de 30s e o modelo de reasoning não cabia: no V7 a prancha real levou mais
      # de 30s (8127 tokens de entrada, 2708 de saída, 869 deles de raciocínio), as três
      # tentativas estouraram em TIMEOUT e o braço sumiu do job. A aritmética NÃO fecha por
      # tentativa: 2 tarefas × 3 tentativas × 240s = 1440s excede o `--timeout 900` do
      # serviço. É deliberado — quem manda no teto de uma cadeia de tentativas é o timeout
      # do serviço, e estourá-lo derruba a invocação e vira reentrega do Pub/Sub, que é o
      # desenho (idempotência por comando, DLQ acima). O que esta variável compra é que uma
      # chamada legítima e lenta termine, em vez de morrer aos 30s e queimar as três
      # tentativas sem nunca ter chance.
      #
      # `CROQUITO_OPENAI_MODEL=gpt-5.6-sol` (decisão humana, 2026-08-19, pós-V10): o
      # gpt-5.6-terra reprovou o contrato duas rodadas seguidas por defeitos de naturezas
      # diferentes — expressão composta em campo decimal no V9, bbox degenerado {1,1,1,1}
      # em todas as 26 leituras no V10 — o que é confiabilidade do modelo na tarefa, não
      # contrato. Sol custa mais por chamada; o volume de HML é uma prancha por rodada.
      #
      # `CROQUITO_OPENAI_ARM_ENABLED=false` (decisão humana, 2026-08-20, pós-V12): a rodada
      # segue só com Anthropic + OCR e o pareamento com o segundo braço fica PAUSADO, para
      # não atrasar outras features — no V12 o pareamento espacial casou leituras de caixas
      # de extensões diferentes, e afinar isso é trabalho próprio. O efeito é declarado: a
      # extração de medida roda em braço único, o pacote sai com
      # `PROVIDER_FALLBACK_SINGLE_EXTRACTOR_ANTHROPIC` e toda leitura nasce ambígua.
      # Religar = trocar esta flag para `true`; a chave `CROQUITO_OPENAI_API_KEY` continua
      # montada em `--set-secrets` de propósito, para que religar não mexa em secret.
      #
      # `CROQUITO_ANTHROPIC_MODEL=claude-fable-5` (teste humano, 2026-08-20): a fraqueza
      # observada do braço âncora nas rodadas V7-V12 é variância em desenho denso de mão
      # (target_hints que somem, recuo do muro omitido), e o Fable é o tier acima do Opus,
      # mais forte exatamente em visão de imagem densa/degradada. Custa 2× por token
      # (US$10/50 vs 5/25 por MTok — centavos por prancha neste volume). Reverter = voltar
      # esta env para claude-opus-5. Exige retenção de dados de 30 dias na conta Anthropic
      # (retenção zero → 400 em toda chamada).
      - name: Publica o worker
        run: |
          set -euo pipefail
          gcloud run services update croquito-jobs-hml \
            --image "$REGISTRO/croquito-python:$GITHUB_SHA" \
            --region "$REGIAO" \
            --service-account croquito-worker-hml@biahflow-hml.iam.gserviceaccount.com \
            --port 8080 \
            --command croquito-worker-push \
            --memory 2Gi --cpu 2 --timeout 900 --concurrency 4 --no-cpu-throttling \
            --set-secrets CROQUITO_DATABASE_URL=croquito-hml-database-url:latest,AWS_ACCESS_KEY_ID=croquito-hml-storage-hmac-id:latest,AWS_SECRET_ACCESS_KEY=croquito-hml-storage-hmac-secret:latest,CROQUITO_OPENAI_API_KEY=croquito-hml-openai-api-key:latest,CROQUITO_ANTHROPIC_API_KEY=croquito-hml-anthropic-api-key:latest \
            --set-env-vars CROQUITO_STORAGE_SSE=false,CROQUITO_AWS_ENDPOINT_URL=https://storage.googleapis.com,AWS_REGION=us-east1,CROQUITO_ARTIFACT_BUCKET=croquito-hml-artifacts,CROQUITO_REAL_PROVIDERS_ENABLED=true,CROQUITO_AI_MAX_ESTIMATED_COST_USD=5.00,CROQUITO_OPENAI_MODEL=gpt-5.6-sol,CROQUITO_OPENAI_ARM_ENABLED=false,CROQUITO_ANTHROPIC_MODEL=claude-fable-5,CROQUITO_PROVIDER_TIMEOUT_SECONDS=240 \
            --startup-probe httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=3,periodSeconds=5,failureThreshold=12,timeoutSeconds=3 \
            --quiet

      # Keycloak em subpath (`/auth`), atrás do proxy do host público: `KC_HOSTNAME` com
      # a URL pública e `KC_PROXY_HEADERS=xforwarded` para o issuer dos tokens sair com
      # o endereço que o navegador usa — issuer errado quebra a validação em todo o
      # resto. `KC_CACHE=local` porque não há cluster: uma instância, cache no processo.
      #
      # `KC_DB_SCHEMA` é o que de fato escolhe o schema, e não o `currentSchema` do JDBC.
      # O `currentSchema` só mexe no `search_path` da sessão; o Liquibase do Keycloak cria e
      # procura tabela no schema padrão dele, que é `public` quando ninguém diz o contrário.
      # Sem esta variável, o `currentSchema=keycloak` do DSN foi obedecido pela conexão e
      # ignorado pelo DDL: as ~88 tabelas do Keycloak nasceram em `public`, misturadas às da
      # aplicação, e o schema `keycloak` sequer existia. Criar esse schema depois faria o
      # Keycloak enxergar um schema vazio e perder realm e usuários.
      #
      # A sonda de subida é folgada de propósito (Keycloak otimizado ainda leva dezenas
      # de segundos e abre conexão com o Neon, que pode estar suspenso). O Cloud Run
      # limita `periodSeconds * failureThreshold` a 240s, então são 24 tentativas de 10s
      # depois de 20s de espera inicial — e não as 30 tentativas que dariam 300s e
      # seriam recusadas pela API.
      - name: Publica o Keycloak
        run: |
          set -euo pipefail
          gcloud run services update croquito-auth-hml \
            --image "$REGISTRO/croquito-auth:$GITHUB_SHA" \
            --region "$REGIAO" \
            --service-account croquito-auth-hml@biahflow-hml.iam.gserviceaccount.com \
            --port 8080 \
            --memory 2Gi --cpu 2 --no-cpu-throttling \
            --set-secrets KC_DB_URL=croquito-hml-kc-db-url:latest,KC_DB_USERNAME=croquito-hml-kc-db-user:latest,KC_DB_PASSWORD=croquito-hml-kc-db-password:latest,KC_BOOTSTRAP_ADMIN_PASSWORD=croquito-hml-kc-bootstrap-admin-password:latest \
            --set-env-vars KC_HOSTNAME=https://croquito-hml.biahflow.ai/auth,KC_HTTP_ENABLED=true,KC_PROXY_HEADERS=xforwarded,KC_CACHE=local,KC_BOOTSTRAP_ADMIN_USERNAME=admin,KC_DB_SCHEMA=keycloak \
            --startup-probe httpGet.path=/auth/realms/master,httpGet.port=8080,initialDelaySeconds=20,periodSeconds=10,failureThreshold=24,timeoutSeconds=5 \
            --quiet

      # A medição hospedada (ADR-0026) tinha um serviço próprio aqui, servindo um
      # diretório de rodada montado por FUSE. Ela era ponte com remoção declarada e saiu
      # com a migração para a API `/v1` autenticada (ADR-0028): a medição agora é rota da
      # API de cena e jornada da mesma SPA, e não tem mais serviço, volume nem passo seu.

      - name: Publica o nginx
        if: hashFiles('docker/web.Dockerfile') != ''
        run: |
          set -euo pipefail
          gcloud run services update croquito-web-hml \
            --image "$REGISTRO/croquito-web:$GITHUB_SHA" \
            --region "$REGIAO" \
            --service-account croquito-web-hml@biahflow-hml.iam.gserviceaccount.com \
            --port 8080 \
            --memory 256Mi \
            --quiet

      # Fumaça, e ela é o que separa "o deploy terminou" de "o deploy funcionou". Todos
      # os outros serviços têm ingress interno, então quem responde de fora é o web — e
      # é justamente ele que prova que o proxy same-origin (`/api/`, `/auth/`) está de
      # pé.
      #
      # É o mesmo `scripts/smoke_hml.py` que roda na máquina do operador (`make
      # smoke-hml`), e ele confere o **conteúdo** de cada rota, não só o status. A
      # diferença não é cosmética: em 2026-08-14 o serviço da API passou a servir o
      # container de exemplo do Cloud Run, que responde 200 em quase todo caminho, e uma
      # fumaça de status teria dito "verde" pelos quatro dias em que a sessão autenticada
      # não subia. O bypass condicional que existia aqui ("pular enquanto o web servir a
      # imagem inicial") saiu junto: a condição está satisfeita desde `d5bbf86`, e fumaça
      # que se pula sozinha ensina a confiar no verde errado.
      #
      # A URL testada é a do serviço, não a do host público: assim o passo prova o deploy
      # e não a CDN. O issuer do OIDC continua sendo o público, porque é o que o Keycloak
      # anuncia — daí o parâmetro separado.
      - name: Fumaça
        run: |
          set -euo pipefail
          url=$(gcloud run services describe croquito-web-hml --region "$REGIAO" \
            --format='value(status.url)')
          python3 scripts/smoke_hml.py \
            --base-url "$url" \
            --issuer-base https://croquito-hml.biahflow.ai

      # Fumaça AUTENTICADA: atravessa o login real com o usuário de fumaça e prova a
      # sessão com `GET /v1/projects` 200. Nasceu do incidente de 2026-08-19 — login
      # fechava no Keycloak, tokens chegavam, e o produto não abria: nenhuma fumaça de
      # status pega isso, porque o defeito só existe DEPOIS da credencial. Roda contra o
      # host público (o fluxo OIDC depende do issuer público), com navegador de verdade.
      #
      # O usuário `smoke.hml` vive só para isto (tenant `tenant-smoke-hml`, isolado dos
      # dados reais) e é recriado junto do realm — runbook HML_KEYCLOAK. A senha vem do
      # secret CROQUITO_HML_SMOKE_PASSWORD (espelho do Secret Manager); se o secret não
      # existir, o passo FALHA — fumaça que se pula sozinha ensina a confiar no verde
      # errado, como o comentário acima já aprendeu.
      - uses: actions/setup-node@v4
        with:
          # A mesma major da imagem de build do web (docker/web.Dockerfile, node:22).
          node-version: 22

      # O download do Chromium (~150 MB) não precisa se repetir a cada deploy; a chave
      # acompanha o lockfile porque é ele quem pina a versão do Playwright.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Fumaça autenticada
        # O passo inteiro (npm ci + playwright install + smoke) fecha em ~5 min. O
        # timeout existe porque o `apt-get` do `--with-deps` já congelou DUAS vezes em
        # 2026-08-19 no mirror azure.archive.ubuntu.com do runner — sem ele, o job
        # segura os 45 min do timeout do job inteiro; com ele, falha rápido e um
        # re-run resolve (o deploy em si já terminou quando este passo roda).
        timeout-minutes: 12
        env:
          CROQUITO_SMOKE_WEB_URL: https://croquito-hml.biahflow.ai
          CROQUITO_SMOKE_USER: smoke.hml
          CROQUITO_SMOKE_PASSWORD: ${{ secrets.CROQUITO_HML_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CROQUITO_SMOKE_PASSWORD" ]; then
            echo "CROQUITO_HML_SMOKE_PASSWORD ausente nos secrets do repositório" >&2
            exit 1
          fi
          npm ci
          # Sem `--with-deps`: o `apt-get` dele congelou CINCO vezes em 2026-08-19 no
          # mirror do runner, e o próprio log provava que as libs já estavam instaladas
          # ("is already the newest version" em série) — o runner ubuntu-latest traz as
          # dependências do Chromium. O binário vem do cache (actions/cache acima); se
          # um dia faltar lib, o launch falha com erro claro e aí se adiciona uma lista
          # apt mínima com retries, não o `--with-deps` inteiro de volta.
          npx playwright install chromium
          npm --workspace @croquito/web run smoke:auth
